<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Black background -->
  <rect width="32" height="32" fill="#000"/>

  <!-- Soma (cell body) -->
  <circle cx="16" cy="16" r="3" fill="none" stroke="#fff" stroke-width="1.5"/>

  <!-- NW dendrite with branch -->
  <line x1="13.9" y1="13.9" x2="9" y2="9" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="9" y1="9" x2="6" y2="7" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <line x1="9" y1="9" x2="7" y2="12" stroke="#fff" stroke-width="1" stroke-linecap="round"/>

  <!-- NE dendrite with branch -->
  <line x1="18.1" y1="13.9" x2="23" y2="9" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="23" y1="9" x2="26" y2="7" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <line x1="23" y1="9" x2="25" y2="12" stroke="#fff" stroke-width="1" stroke-linecap="round"/>

  <!-- W dendrite with branch -->
  <line x1="13" y1="16" x2="6" y2="16" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="6" y1="16" x2="3" y2="14" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <line x1="6" y1="16" x2="3" y2="18" stroke="#fff" stroke-width="1" stroke-linecap="round"/>

  <!-- S dendrite with branch -->
  <line x1="15" y1="19" x2="11" y2="25" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="11" y1="25" x2="9" y2="28" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <line x1="11" y1="25" x2="13" y2="28" stroke="#fff" stroke-width="1" stroke-linecap="round"/>

  <!-- E axon (longer — main output) with terminals -->
  <line x1="19" y1="16" x2="27" y2="16" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="30" y2="13" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="30" y2="16" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="30" y2="19" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
</svg>
